version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies"
      - npm ci --production=false
      - npm install -g pm2

  pre_build:
    commands:
      - echo "Skipping tests (handled by GitHub Actions CI)"
      - echo "Pre-build checks passed"

  build:
    commands:
      - echo "Build started"
      - BUILD_VERSION=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION}" | cut -c1-7)-$(date +%Y%m%d%H%M%S)
      - S3_ARTIFACT_KEY="builds/${BUILD_VERSION}/artifact.zip"
      - echo "Build version is ${BUILD_VERSION}"
      - echo "Artifact key is ${S3_ARTIFACT_KEY}"
      - npm run build || true
      - echo "Build completed"

  post_build:
    commands:
      - echo "Packaging artifact"
      - mkdir -p dist
      - cp -r src/ dist/src/
      - cp -r node_modules/ dist/node_modules/
      - cp package.json dist/
      - cp pm2/ecosystem.config.js dist/
      - cd dist && zip -r ../artifact.zip . && cd ..
      - echo "Uploading artifact to S3"
      - aws s3 cp artifact.zip "s3://my-app-build-artifacts/${S3_ARTIFACT_KEY}"
      - echo "BUILD_VERSION=${BUILD_VERSION}" >> build.env
      - echo "S3_ARTIFACT_KEY=${S3_ARTIFACT_KEY}" >> build.env
      - echo "BUILD SUCCESSFUL"

artifacts:
  files:
    - build.env
  discard-paths: yes

cache:
  paths:
    - node_modules/**/*
    - .npm/**/*
