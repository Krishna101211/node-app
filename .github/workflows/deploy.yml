name: Deploy to Production

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '20.11.0'
  S3_BUCKET: my-app-build-artifacts

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.version }}
      s3_key: ${{ steps.version.outputs.s3_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build || true
      - name: Generate version
        id: version
        run: |
          VERSION="${GITHUB_SHA:0:7}-$(date +%Y%m%d%H%M%S)"
          S3_KEY="builds/${VERSION}/artifact.zip"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"
      - name: Package artifact
        run: |
          mkdir -p package
          cp -r src/ package/src/
          cp -r node_modules/ package/node_modules/
          cp package.json package/
          cp pm2/ecosystem.config.js package/
          cd package && zip -r ../artifact.zip .
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Upload artifact to S3
        run: |
          aws s3 cp artifact.zip "s3://${{ env.S3_BUCKET }}/${{ steps.version.outputs.s3_key }}"
          echo "Uploaded to: s3://${{ env.S3_BUCKET }}/${{ steps.version.outputs.s3_key }}"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            /opt/app/deploy.sh ${{ needs.build.outputs.build_version }}
      - name: Health check
        run: |
          MAX_RETRIES=30
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -sf "https://${{ secrets.EC2_HOST }}/health" > /dev/null 2>&1; then
              echo "Health check passed!"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT/$MAX_RETRIES - waiting..."
            sleep 5
          done
          echo "Health check failed!"
          exit 1
      - name: Notify on success
        if: success()
        run: echo "Deployment of ${{ needs.build.outputs.build_version }} succeeded"
      - name: Notify on failure
        if: failure()
        run: echo "Deployment of ${{ needs.build.outputs.build_version }} FAILED"
